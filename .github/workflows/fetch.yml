name: btc-data
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: btc-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch
        env:
          COINGLASS_KEY: ${{ secrets.COINGLASS_KEY }}
          CRYPTOQUANT_KEY: ${{ secrets.CRYPTOQUANT_KEY }}
        run: python fetch.py
      - name: commit
        run: |
          git config user.name "btc-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add summary.json
          git commit -m "update $(date -u +%FT%TZ)" || echo "no change"
          git push
