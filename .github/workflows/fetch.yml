name: btc-data
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_brief:
        description: "立刻发一条简报"
        default: "1"
permissions:
  contents: write
concurrency:
  group: btc-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch
        env:
          COINGLASS_KEY: ${{ secrets.COINGLASS_KEY }}
          CRYPTOQUANT_KEY: ${{ secrets.CRYPTOQUANT_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_BRIEF: ${{ github.event.inputs.force_brief }}
          OKX_1_KEY: ${{ secrets.OKX_1_KEY }}
          OKX_1_SECRET: ${{ secrets.OKX_1_SECRET }}
          OKX_1_PASS: ${{ secrets.OKX_1_PASS }}
          OKX_2_KEY: ${{ secrets.OKX_2_KEY }}
          OKX_2_SECRET: ${{ secrets.OKX_2_SECRET }}
          OKX_2_PASS: ${{ secrets.OKX_2_PASS }}
          OKX_3_KEY: ${{ secrets.OKX_3_KEY }}
          OKX_3_SECRET: ${{ secrets.OKX_3_SECRET }}
          OKX_3_PASS: ${{ secrets.OKX_3_PASS }}
          OKX_4_KEY: ${{ secrets.OKX_4_KEY }}
          OKX_4_SECRET: ${{ secrets.OKX_4_SECRET }}
          OKX_4_PASS: ${{ secrets.OKX_4_PASS }}
        run: python fetch.py
      - name: commit
        run: |
          git config user.name "btc-data-bot"
          git config user.email "bot@users.noreply.github.com"
          git add summary.json
          [ -f alerts_state.json ] && git add alerts_state.json || true
          git commit -m "update $(date -u +%FT%TZ)" || echo "no change"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main || { git rebase --abort 2>/dev/null; git fetch origin main && git reset --soft origin/main && git add summary.json && ([ -f alerts_state.json ] && git add alerts_state.json || true) && git commit -m "update $(date -u +%FT%TZ)"; }
            git push && break || sleep 5
          done
